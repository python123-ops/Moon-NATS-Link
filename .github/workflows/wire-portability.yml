name: wire portability

on:
  push:
  pull_request:

jobs:
  wire-portability:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install MoonBit from the official CLI distribution
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add MoonBit to subsequent steps
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: moon update
      - name: Keep source formatting stable
        run: moon fmt --check
      - name: Check the portable wire package
        run: moon check src/wire --target all --deny-warn
      - name: Exercise every wire backend
        run: moon test src/wire --target all --deny-warn
