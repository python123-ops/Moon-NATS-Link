<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Moon NATS Link message path</title>
  <desc id="description">The path from application APIs through one native NATS connection to typed messages, flush barriers, and request outcomes.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#397a9f"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b96362"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 27px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .subtitle { font: 400 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .section { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #243b53; letter-spacing: .3px; }
      .label { font: 650 14px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #243b53; }
      .small { font: 400 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #52677a; }
      .mono { font: 600 12px "Cascadia Mono", "SFMono-Regular", monospace; fill: #31546d; }
      .panel { stroke-width: 1.6; stroke-dasharray: 8 7; rx: 18; }
      .card { fill: #ffffff; stroke-width: 1.25; rx: 11; filter: url(#soft-shadow); }
      .arrow { fill: none; stroke: #397a9f; stroke-width: 2.3; marker-end: url(#arrow-blue); }
      .arrow-return { fill: none; stroke: #b96362; stroke-width: 2.3; marker-end: url(#arrow-coral); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#fbfcfe"/>
  <text x="50" y="48" class="title">从 TCP 分块到类型化请求结果</text>
  <text x="50" y="74" class="subtitle">Moon NATS Link · 一条连接内的消息时序与工程边界</text>

  <rect x="44" y="104" width="244" height="466" class="panel" fill="#fff5cf" stroke="#d2aa45"/>
  <text x="66" y="136" class="section">应用交互</text>

  <rect x="66" y="160" width="200" height="74" class="card" stroke="#d8b553"/>
  <text x="166" y="187" text-anchor="middle" class="label">发布与订阅</text>
  <text x="166" y="211" text-anchor="middle" class="mono">publish · subscribe</text>

  <rect x="66" y="258" width="200" height="92" class="card" stroke="#d8b553"/>
  <text x="166" y="285" text-anchor="middle" class="label">请求应答</text>
  <text x="166" y="309" text-anchor="middle" class="mono">request → Message</text>
  <text x="166" y="331" text-anchor="middle" class="small">正常响应 / 503 / Timeout</text>

  <rect x="66" y="374" width="200" height="76" class="card" stroke="#d8b553"/>
  <text x="166" y="402" text-anchor="middle" class="label">消息元数据</text>
  <text x="166" y="426" text-anchor="middle" class="small">大小写与重复字段均保留</text>

  <rect x="66" y="474" width="200" height="68" class="card" stroke="#d8b553"/>
  <text x="166" y="501" text-anchor="middle" class="label">作用域生命周期</text>
  <text x="166" y="524" text-anchor="middle" class="small">with_client 内无逃逸任务</text>

  <rect x="322" y="104" width="526" height="466" class="panel" fill="#e9f5fb" stroke="#6aa6c7"/>
  <text x="344" y="136" class="section">一条 native 连接</text>

  <rect x="346" y="160" width="210" height="88" class="card" stroke="#72a9c5"/>
  <text x="451" y="187" text-anchor="middle" class="label">Writer 邮箱</text>
  <text x="451" y="211" text-anchor="middle" class="mono">SUB · UNSUB · PUB · HPUB</text>
  <text x="451" y="231" text-anchor="middle" class="mono">PING · PONG</text>

  <rect x="614" y="160" width="210" height="88" class="card" stroke="#72a9c5"/>
  <text x="719" y="187" text-anchor="middle" class="label">nats-server v2.14.6</text>
  <text x="719" y="211" text-anchor="middle" class="small">单 TCP 字节流</text>
  <text x="719" y="231" text-anchor="middle" class="small">命令按连接顺序处理</text>

  <path d="M556 190 H604" class="arrow"/>
  <path d="M614 222 H566" class="arrow-return"/>

  <rect x="346" y="282" width="478" height="112" class="card" stroke="#72a9c5"/>
  <text x="585" y="310" text-anchor="middle" class="label">增量 Decoder</text>
  <rect x="370" y="330" width="122" height="42" rx="8" fill="#dff0f8" stroke="#83afc6"/>
  <text x="431" y="356" text-anchor="middle" class="small">控制行状态</text>
  <rect x="524" y="330" width="122" height="42" rx="8" fill="#dff0f8" stroke="#83afc6"/>
  <text x="585" y="356" text-anchor="middle" class="small">定长 body</text>
  <rect x="678" y="330" width="122" height="42" rx="8" fill="#dff0f8" stroke="#83afc6"/>
  <text x="739" y="356" text-anchor="middle" class="small">MSG / HMSG</text>
  <path d="M492 351 H514" class="arrow"/>
  <path d="M646 351 H668" class="arrow"/>

  <rect x="346" y="426" width="210" height="112" class="card" stroke="#72a9c5"/>
  <text x="451" y="454" text-anchor="middle" class="label">SID 路由</text>
  <text x="451" y="480" text-anchor="middle" class="mono">Map[Int, Queue[Message]]</text>
  <text x="451" y="506" text-anchor="middle" class="small">二进制 payload 不转码</text>
  <text x="451" y="525" text-anchor="middle" class="small">未知 SID 是协议错误</text>

  <rect x="614" y="426" width="210" height="112" class="card" stroke="#72a9c5"/>
  <text x="719" y="454" text-anchor="middle" class="label">Header 解释</text>
  <text x="719" y="480" text-anchor="middle" class="mono">NATS/1.0 · status</text>
  <text x="719" y="506" text-anchor="middle" class="small">ASCII 边界检查</text>
  <text x="719" y="525" text-anchor="middle" class="small">大小写与多值顺序保留</text>

  <path d="M585 394 V416 H451 V426" class="arrow"/>
  <path d="M585 394 V416 H719 V426" class="arrow"/>

  <rect x="882" y="104" width="274" height="466" class="panel" fill="#fceced" stroke="#ca8585"/>
  <text x="904" y="136" class="section">语义护栏</text>

  <rect x="904" y="160" width="230" height="94" class="card" stroke="#cf9191"/>
  <text x="1019" y="188" text-anchor="middle" class="label">Flush 屏障</text>
  <text x="1019" y="213" text-anchor="middle" class="mono">PING → FIFO waiter → PONG</text>
  <text x="1019" y="235" text-anchor="middle" class="small">确认此前命令已由服务端处理</text>

  <rect x="904" y="280" width="230" height="112" class="card" stroke="#cf9191"/>
  <text x="1019" y="308" text-anchor="middle" class="label">安全取消订阅</text>
  <text x="1019" y="333" text-anchor="middle" class="mono">UNSUB → flush → detach SID</text>
  <text x="1019" y="358" text-anchor="middle" class="small">屏障前到达的消息继续入队</text>
  <text x="1019" y="378" text-anchor="middle" class="small">缓冲耗尽后 SubscriptionClosed</text>

  <rect x="904" y="418" width="230" height="120" class="card" stroke="#cf9191"/>
  <text x="1019" y="446" text-anchor="middle" class="label">一次请求，一份响应</text>
  <text x="1019" y="471" text-anchor="middle" class="mono">random inbox · UNSUB sid 1</text>
  <text x="1019" y="496" text-anchor="middle" class="small">503 映射为 NoResponders</text>
  <text x="1019" y="517" text-anchor="middle" class="small">超时后取消并跨越处理屏障</text>

  <path d="M288 304 H312 V204 H336" class="arrow"/>
  <path d="M848 204 H872 V207 H894" class="arrow"/>
  <path d="M848 482 H872 V336 H894" class="arrow"/>
  <path d="M894 478 H870 V552 H300 V412 H276" class="arrow-return"/>

  <rect x="44" y="604" width="1112" height="62" rx="16" fill="#edf7ee" stroke="#86b68b" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="66" y="629" class="section">运行证据</text>
  <text x="66" y="651" class="small">wire：wasm / wasm-gc / js / native</text>
  <text x="374" y="651" class="small">client：Linux native</text>
  <text x="608" y="651" class="small">互操作：headers · request/reply · 503 · timeout · unsubscribe</text>
</svg>
